# SkyVanta AI — Default Configuration File
detector:
  use_yolo: true
  yolo_model_path: "yolov8n.pt"
  yolo_confidence_threshold: 0.08
  yolo_input_size: 640
  yolo_accept_classes:
    - airplane
    - bird
    - kite
    - frisbee
  motion_history: 120
  motion_var_threshold: 18.0
  motion_min_area_ratio: 0.00004
  motion_max_area_ratio: 0.06
  fusion_iou_threshold: 0.1

smoothing:
  center_min_cutoff: 1.0
  center_beta: 0.015
  size_min_cutoff: 1.0
  size_beta: 0.01
  telemetry_min_cutoff: 0.8
  telemetry_beta: 0.01
  corridor_min_cutoff: 0.7
  corridor_beta: 0.02

tracker:
  kalman_process_noise: 0.01
  kalman_measurement_noise: 0.1
  max_lost_frames: 45
  jump_distance_ratio: 0.045
  max_trail_length: 45
  scale_history_length: 60

visualization:
  enabled: true
  frame_margin: 24
  fps_target: 30.0
  show_radar: true
  show_corridor: true
  show_telemetry: true

pipeline:
  max_dimension: 1280
  default_fps: 30.0
  output_dir: "output"
  demo_duration_sec: 13.0
