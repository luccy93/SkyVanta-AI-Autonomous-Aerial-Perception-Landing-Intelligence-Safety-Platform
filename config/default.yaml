# SkyVanta AI — Master Configuration File
perception:
  enabled: true
  detector:
    use_yolo: true
    yolo_model_path: "yolov8n.pt"
    yolo_confidence_threshold: 0.08
    yolo_iou_threshold: 0.45
    yolo_input_size: 640
    yolo_device: "cpu"
    yolo_accept_classes:
      - airplane
      - bird
      - kite
      - frisbee
  motion:
    enabled: true
    history: 120
    var_threshold: 18.0
    detect_shadows: false
    min_area_ratio: 0.00004
    max_area_ratio: 0.06
    min_aspect_ratio: 0.25
    max_aspect_ratio: 4.5
    edge_weight: 3.0
  optical_flow:
    enabled: true
    pyr_scale: 0.5
    levels: 2
    winsize: 15
    iterations: 2
    poly_n: 5
    poly_sigma: 1.1
    magnitude_threshold: 40.0
  fusion:
    iou_threshold: 0.10
    weight_detection: 0.50
    weight_motion: 0.30
    weight_flow: 0.10
    weight_iou: 0.10
  selection:
    min_candidate_score: 0.15
    min_box_area_ratio: 0.00004
    max_box_area_ratio: 0.25
    roi_top_cutoff_ratio: 0.85

smoothing:
  center_min_cutoff: 1.0
  center_beta: 0.015
  size_min_cutoff: 1.0
  size_beta: 0.01
  telemetry_min_cutoff: 0.8
  telemetry_beta: 0.01
  corridor_min_cutoff: 0.7
  corridor_beta: 0.02

tracker:
  kalman_process_noise: 0.01
  kalman_measurement_noise: 0.1
  max_lost_frames: 45
  jump_distance_ratio: 0.045
  max_trail_length: 45
  scale_history_length: 60

visualization:
  enabled: true
  frame_margin: 24
  fps_target: 30.0
  show_radar: true
  show_corridor: true
  show_telemetry: true

pipeline:
  max_dimension: 1280
  default_fps: 30.0
  output_dir: "output"
  demo_duration_sec: 13.0
