[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyvanta"
version = "0.1.0"
description = "SkyVanta AI — Autonomous Aerial Perception, Landing Intelligence & Safety Platform"
readme = "README.md"
authors = [
    { name = "SkyVanta-AI / Devendraprasad" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-contrib-python>=4.8.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
skyvanta = "skyvanta.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skyvanta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
