name: SkyVanta AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Regression Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run lint & syntax quality checks
        run: |
          # Stop build on Python syntax errors or undefined names
          flake8 skyvanta tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero for style warnings
          flake8 skyvanta tests --count --exit-zero --max-complexity=20 --max-line-length=127 --statistics

      - name: Run pytest test suite
        run: |
          pytest -v --tb=short

      - name: Verify package build
        run: |
          python -m pip install build
          python -m build --wheel
