name: SkyVanta AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Regression Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run lint & syntax quality checks
        run: |
          # Stop build on Python syntax errors or undefined names
          flake8 skyvanta tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero for style warnings
          flake8 skyvanta tests --count --exit-zero --max-complexity=20 --max-line-length=127 --statistics

      - name: Run pytest test suite
        run: |
          pytest -v --tb=short

      - name: Verify package build
        run: |
          python -m pip install build
          python -m build --wheel

  release-gate:
    name: Production Release & Disaster Recovery Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Execute CLI Pre-Flight Release Verification
        env:
          SKYVANTA_ENV: production
          SKYVANTA_GIT_SHA: ${{ github.sha }}
          SKYVANTA_ALLOW_EXTERNAL: "false"
          SKYVANTA_ALLOW_NETWORK_DOWNLOAD: "false"
        run: |
          python -m skyvanta release

      - name: Verify Hardened Docker Image Build
        run: |
          docker build -t skyvanta-ai:latest .

      - name: Verify Docker Healthcheck & Security Constraints
        run: |
          docker run --rm \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -e SKYVANTA_ENV=production \
            -e SKYVANTA_ALLOW_EXTERNAL=false \
            -e SKYVANTA_ALLOW_NETWORK_DOWNLOAD=false \
            skyvanta-ai:latest \
            python -c "from skyvanta.deployment import HealthCheckService, StartupValidator; res = HealthCheckService().check_health(); StartupValidator().validate_or_raise(); print('Health & Invariants Verified:', res.status.value)"
